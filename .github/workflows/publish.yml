# Publish @young1lin/dsh-ui-gitworkbench to npm via Trusted Publishing (OIDC).
#
# Trigger: pushing a vX.Y.Z tag. Authentication is npm Trusted Publishing —
# the GitHub Actions OIDC token identifies this workflow to npm; there is NO
# NPM_TOKEN / NODE_AUTH_TOKEN secret anywhere. Provenance is generated
# automatically by npm for trusted-publishing uploads, no flag needed.
#
# Requires (one-time, manual, see README "发布（维护者）"):
#   1. the package to already exist on npm (first publish is done by hand)
#   2. npmjs.com → package Settings → Trusted publishing configured with
#      user young1lin / repo dsh-ui-gitworkbench / workflow publish.yml
#
# Node 24 because Trusted Publishing needs npm >= 11.5.1; Node 22's bundled
# npm is older, so the step below upgrades npm only when below that bar.
name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1 (Trusted Publishing requirement)
        run: |
          npm --version
          if [ "$(printf '%s\n' '11.5.1' "$(npm --version)" | sort -V | head -n1)" != '11.5.1' ]; then
            npm install -g npm@latest
            npm --version
          fi

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag: ${TAG}, package.json: ${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "git tag ${TAG} does not match package.json version ${PKG}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (host + client tsconfigs)
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build (tsc host half + tsdown client half)
        run: pnpm run bundle

      # Same gate as ci.yml, on the artifact this workflow is about to
      # publish: any leaked builder path here would embed /home/runner/... in
      # the shipped tarball.
      - name: Scan build output for machine paths
        run: |
          if grep -rInE --include='*.js' '/home/runner|/Users/[A-Za-z]|/root/|[A-Za-z]:\\Users' lib/; then
            echo "::error::machine path leaked into lib/ (matches above)"
            exit 1
          fi
          echo "lib/*.js clean: no machine paths"

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
